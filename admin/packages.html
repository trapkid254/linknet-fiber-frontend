<!-- admin/packages.html - Package Management Page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA / App Install -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Linknet Fiber">
    <meta name="theme-color" content="#1E4D8C">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">

    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Packages - Admin Dashboard - Linknet Fiber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=1.3">
    <link rel="stylesheet" href="../css/admin.css?v=1.3">
    <style>
        /* Package Management Styles */
        .packages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .packages-header h2 {
            color: #1E4D8C;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-filter {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            padding: 0.75rem 1rem;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 0.9rem;
            min-width: 250px;
        }

        .filter-select {
            padding: 0.75rem 1rem;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 0.9rem;
            background: white;
        }

        @media (max-width: 768px) {
            .packages-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-filter {
                width: 100%;
            }

            .search-input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-wifi"></i>
                    <span>Linknet Admin</span>
                </div>
                <button class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="dashboard.html">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                    </li>
                    <li class="active">
                        <a href="packages.html">
                            <i class="fas fa-box"></i> Packages
                        </a>
                    </li>
                    <li>
                        <a href="install-requests.html">
                            <i class="fas fa-clipboard-list"></i> Installation Requests
                        </a>
                    </li>
                    <li>
                        <a href="coverage.html">
                            <i class="fas fa-map-marker-alt"></i> Coverage Areas
                        </a>
                    </li>
                    <li>
                        <a href="customers.html">
                            <i class="fas fa-users"></i> Customers
                        </a>
                    </li>
                    <li>
                        <a href="analytics.html">
                            <i class="fas fa-chart-bar"></i> Analytics
                        </a>
                    </li>
                    <li>
                        <a href="settings.html">
                            <i class="fas fa-cog"></i> Settings
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-content">
                    <h1>Packages</h1>
                    <div class="header-actions">
                        <button class="btn btn-primary" onclick="addPackage()">
                            <i class="fas fa-plus"></i> Add Package
                        </button>
                        <button class="btn btn-outline" onclick="exportPackages()">
                            <i class="fas fa-download"></i> Export
                        </button>
                    </div>
                </div>
            </header>

            <!-- Packages Content -->
            <div class="packages-header">
                <h2>Package Management</h2>
                <div class="search-filter">
                    <input type="text" class="search-input" placeholder="Search packages..." id="packageSearch">
                    <select class="filter-select" id="statusFilter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <!-- Packages Table -->
            <div class="data-table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Package Name</th>
                            <th>Speed</th>
                            <th>Price</th>
                            <th>Features</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="packages-table-body">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">
                                <div class="loading-spinner">Loading packages...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Package Modal -->
    <div id="package-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Package</h3>
                <button class="modal-close" onclick="closePackageModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="package-form">
                <div class="form-group">
                    <label for="packageName">Package Name</label>
                    <input type="text" id="packageName" name="name" required>
                </div>
                <div class="form-group">
                    <label for="packageSpeed">Speed (Mbps)</label>
                    <input type="number" id="packageSpeed" name="speed" required>
                </div>
                <div class="form-group">
                    <label for="packagePrice">Price (KES)</label>
                    <input type="number" id="packagePrice" name="price" required>
                </div>
                <div class="form-group">
                    <label for="packageFeatures">Features (comma-separated)</label>
                    <textarea id="packageFeatures" name="features" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="packageStatus">Status</label>
                    <select id="packageStatus" name="status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="packageFeatured">Featured</label>
                    <select id="packageFeatured" name="featured">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="closePackageModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Package</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/darkmode.js"></script>
    <script src="../js/admin-dashboard.js"></script>
    <script src="../js/auth-manager.js?v=1.0.0"></script>
    <script src="../js/validation.js?v=1.0.0"></script>
    <script src="../js/offline-manager.js?v=1.0.0"></script>
    <script>
        // Package management specific functions
        document.addEventListener('DOMContentLoaded', function() {
            loadPackages();
            loadAdminProfile();
        });

        function addPackage() {
            document.getElementById('package-modal').style.display = 'flex';
        }

        function closePackageModal() {
            document.getElementById('package-modal').style.display = 'none';
            document.getElementById('package-form').reset();
        }

        function exportPackages() {
            alert('Export packages feature coming soon!');
        }

        // Search functionality
        document.getElementById('packageSearch')?.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#packages-table-body tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        });

        // Filter functionality
        document.getElementById('statusFilter')?.addEventListener('change', function(e) {
            const filterValue = e.target.value;
            const rows = document.querySelectorAll('#packages-table-body tr');
            
            rows.forEach(row => {
                if (filterValue === '') {
                    row.style.display = '';
                } else {
                    const status = row.querySelector('.status-badge')?.textContent.toLowerCase();
                    row.style.display = status === filterValue ? '' : 'none';
                }
            });
        });

        // Package form submission
        document.getElementById('package-form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            // Handle package creation logic here
            alert('Package creation feature coming soon!');
            closePackageModal();
        });

        // Close modal when clicking outside
        document.getElementById('package-modal')?.addEventListener('click', function(e) {
            if (e.target === this) {
                closePackageModal();
            }
        });
    </script>
</body>
</html>
