<!-- admin/login.html - Admin Login -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA / App Install -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Linknet Fiber">
    <meta name="theme-color" content="#1E4D8C">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">


    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Admin Login - Linknet Fiber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css?v=1.3">
    <link rel="stylesheet" href="/css/admin.css?v=1.4">
</head>
<body class="admin-login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <a href="/" class="login-logo">
                    <span class="brand-text">Linknet<span class="brand-accent">Fiber</span></span>
                </a>
                <h1>Admin Portal</h1>
                <p>Secure access for authorized personnel only</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Email or Username
                    </label>
                    <input type="text" id="username" name="username" required placeholder="Enter email or username" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-large btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                
                <div id="login-message" class="form-message" aria-live="polite"></div>
            </form>
            
            <div class="login-footer">
                <a href="/"><i class="fas fa-arrow-left"></i> Back to Website</a>
                <p class="demo-credentials">
                </p>
            </div>
        </div>
    </div>
    
    <script src="/js/darkmode.js?v=1.3"></script>
    <script src="/js/admin-login.js?v=1.3"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered successfully:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
    
    <!-- Cache-busting script to force CSS and JS reload -->
    <script>
        // Force CSS and JS reload to prevent caching issues
        (function() {
            const timestamp = new Date().getTime();
            
            // Update CSS links
            const links = document.querySelectorAll('link[rel="stylesheet"]');
            links.forEach(function(link) {
                if (link.href.includes('css/style.css') || link.href.includes('css/admin.css')) {
                    const url = new URL(link.href, window.location.origin);
                    url.searchParams.set('v', timestamp);
                    link.href = url.toString();
                }
            });
            
            // Update JS scripts
            const scripts = document.querySelectorAll('script[src]');
            scripts.forEach(function(script) {
                if (script.src.includes('js/admin-login.js') || script.src.includes('js/darkmode.js')) {
                    const url = new URL(script.src, window.location.origin);
                    url.searchParams.set('v', timestamp);
                    script.src = url.toString();
                }
            });
        })();
    </script>
</body>
</html>
