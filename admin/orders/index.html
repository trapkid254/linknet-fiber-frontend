<!-- admin/orders.html - Admin Orders Management -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1E4D8C">

    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Orders - Admin Dashboard - Linknet Fiber</title>

    <!-- Authentication Check - Runs immediately -->
    <script>
        (function() {
            const AUTH_KEY = 'linknet_admin_auth';
            const authData = localStorage.getItem(AUTH_KEY);
            
            if (!authData) {
                window.location.href = '/admin/login/';
                return;
            }
            
            try {
                const parsed = JSON.parse(authData);
                if (parsed.expires && parsed.expires < Date.now()) {
                    localStorage.removeItem(AUTH_KEY);
                    window.location.href = '/admin/login/';
                    return;
                }
            } catch (error) {
                localStorage.removeItem(AUTH_KEY);
                window.location.href = '/admin/login/';
                return;
            }
        })();
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css?v=1.3">
    <link rel="stylesheet" href="/css/admin.css?v=1.4">
</head>
<body class="admin-dashboard">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-wifi"></i>
                <span>Linknet Admin</span>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="/admin/dashboard/" class="sidebar-link">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="/admin/packages/" class="sidebar-link">
                <i class="fas fa-box"></i>
                <span>Packages</span>
            </a>
            <a href="/admin/products/" class="sidebar-link">
                <i class="fas fa-shopping-cart"></i>
                <span>Products</span>
            </a>
            <a href="/admin/orders/" class="sidebar-link active">
                <i class="fas fa-receipt"></i>
                <span>Orders</span>
            </a>
            <a href="/admin/requests/" class="sidebar-link">
                <i class="fas fa-wifi"></i>
                <span>Requests</span>
            </a>
            <a href="/admin/customers/" class="sidebar-link">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </a>
            <a href="/admin/coverage/" class="sidebar-link">
                <i class="fas fa-map-marked-alt"></i>
                <span>Coverage</span>
            </a>
            <a href="/admin/analytics/" class="sidebar-link">
                <i class="fas fa-chart-line"></i>
                <span>Analytics</span>
            </a>
            <a href="/admin/settings/" class="sidebar-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <a href="/" class="sidebar-link" target="_blank">
                <i class="fas fa-external-link-alt"></i>
                <span>View Site</span>
            </a>
            <a href="/admin/logout/" class="sidebar-link sidebar-logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Orders Management</h1>
            </div>
            <div class="header-right">
                <select class="form-input" id="filter-status" style="width: 150px;">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="processing">Processing</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
        </header>

        <!-- Content -->
        <div class="admin-content">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Total Orders</h3>
                        <p id="total-orders">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #F59E0B;">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Pending</h3>
                        <p id="pending-orders">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #3B82F6;">
                        <i class="fas fa-spinner"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Processing</h3>
                        <p id="processing-orders">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #10B981;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Completed</h3>
                        <p id="completed-orders">0</p>
                    </div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="card">
                <div class="card-header">
                    <h2>All Orders</h2>
                    <div class="card-actions">
                        <input type="text" class="search-input" id="search-orders" placeholder="Search orders...">
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Items</th>
                                    <th>Total</th>
                                    <th>Payment</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table-body">
                                <tr>
                                    <td colspan="8" class="text-center">
                                        <i class="fas fa-spinner fa-spin"></i> Loading orders...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Order Details Modal -->
    <div id="order-modal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h2>Order Details</h2>
                <button class="modal-close" id="close-order-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="order-details-content">
                <!-- Order details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="/js/admin-orders.js"></script>
</body>
</html>
