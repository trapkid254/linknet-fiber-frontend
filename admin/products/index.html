<!-- admin/products.html - Admin Products Management -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1E4D8C">

    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Products - Admin Dashboard - Linknet Fiber</title>

    <!-- Authentication Check - Runs immediately -->
    <script>
        (function() {
            const AUTH_KEY = 'linknet_admin_auth';
            const authData = localStorage.getItem(AUTH_KEY);
            
            if (!authData) {
                window.location.href = '/admin/login/';
                return;
            }
            
            try {
                const parsed = JSON.parse(authData);
                if (parsed.expires && parsed.expires < Date.now()) {
                    localStorage.removeItem(AUTH_KEY);
                    window.location.href = '/admin/login/';
                    return;
                }
            } catch (error) {
                localStorage.removeItem(AUTH_KEY);
                window.location.href = '/admin/login/';
                return;
            }
        })();
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css?v=1.3">
    <link rel="stylesheet" href="/css/admin.css?v=1.4">
</head>
<body class="admin-dashboard">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-wifi"></i>
                <span>Linknet Admin</span>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="/admin/dashboard/" class="sidebar-link">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="/admin/packages/" class="sidebar-link">
                <i class="fas fa-box"></i>
                <span>Packages</span>
            </a>
            <a href="/admin/products/" class="sidebar-link active">
                <i class="fas fa-shopping-cart"></i>
                <span>Products</span>
            </a>
            <a href="/admin/orders/" class="sidebar-link">
                <i class="fas fa-receipt"></i>
                <span>Orders</span>
            </a>
            <a href="/admin/requests/" class="sidebar-link">
                <i class="fas fa-wifi"></i>
                <span>Requests</span>
            </a>
            <a href="/admin/customers/" class="sidebar-link">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </a>
            <a href="/admin/coverage/" class="sidebar-link">
                <i class="fas fa-map-marked-alt"></i>
                <span>Coverage</span>
            </a>
            <a href="/admin/analytics/" class="sidebar-link">
                <i class="fas fa-chart-line"></i>
                <span>Analytics</span>
            </a>
            <a href="/admin/settings/" class="sidebar-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <a href="/" class="sidebar-link" target="_blank">
                <i class="fas fa-external-link-alt"></i>
                <span>View Site</span>
            </a>
            <a href="/admin/logout/" class="sidebar-link sidebar-logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Products Management</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="add-product-btn">
                    <i class="fas fa-plus"></i>
                    Add Product
                </button>
            </div>
        </header>

        <!-- Content -->
        <div class="admin-content">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-box"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Total Products</h3>
                        <p id="total-products">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-wifi"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Routers</h3>
                        <p id="total-routers">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-network-wired"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Modems</h3>
                        <p id="total-modems">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-tools"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Accessories</h3>
                        <p id="total-accessories">0</p>
                    </div>
                </div>
            </div>

            <!-- Products Table -->
            <div class="card">
                <div class="card-header">
                    <h2>All Products</h2>
                    <div class="card-actions">
                        <input type="text" class="search-input" id="search-products" placeholder="Search products...">
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="products-table-body">
                                <tr>
                                    <td colspan="6" class="text-center">
                                        <i class="fas fa-spinner fa-spin"></i> Loading products...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Product</h2>
                <button class="modal-close" id="close-product-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <input type="hidden" id="product-id">
                    
                    <div class="form-group">
                        <label class="form-label">Product Name</label>
                        <input type="text" class="form-input" id="product-name" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select class="form-input" id="product-category" required>
                            <option value="">Select category</option>
                            <option value="routers">Routers</option>
                            <option value="modems">Modems</option>
                            <option value="cables">Cables</option>
                            <option value="accessories">Accessories</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-input" id="product-description" rows="3" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Price (KES)</label>
                        <input type="number" class="form-input" id="product-price" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" class="form-input" id="product-stock" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Icon (Font Awesome class) <span class="optional-text">(Optional)</span></label>
                        <input type="text" class="form-input" id="product-icon" placeholder="fas fa-wifi">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Product Image <span class="optional-text">(Optional)</span></label>
                        <input type="file" class="form-input" id="product-image" accept="image/*">
                        <div id="image-preview" class="image-preview"></div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Features (comma separated) <span class="optional-text">(Optional)</span></label>
                        <input type="text" class="form-input" id="product-features" placeholder="Dual-Band, 4 LAN Ports, USB 3.0">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select class="form-input" id="product-status" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancel-product-btn">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/admin-products.js"></script>
</body>
</html>
