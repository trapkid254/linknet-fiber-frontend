<!-- client/register.html - Client Registration -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA / App Install -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Linknet Fiber">
    <meta name="theme-color" content="#1E4D8C">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">

    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Register - Client Portal - Linknet Fiber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=1.3">
    <link rel="stylesheet" href="../css/admin.css?v=1.3">
    <style>
        /* Client Registration Styles */
        .client-register-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #1E4D8C 0%, #2A5F9F 50%, #3A7BC8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .client-register-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="20" cy="80" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="80" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            background-size: 100px 100px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 100px); }
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            max-height: 90vh;
            overflow-y: auto;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .brand-logo i {
            font-size: 2.5rem;
            color: #1E4D8C;
        }

        .brand-logo span {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1E4D8C;
        }

        .brand-logo .brand-accent {
            color: #4ecdc4;
        }

        .register-header h1 {
            color: #1E4D8C;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .register-header p {
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 0;
        }

        .register-form {
            margin-bottom: 2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-group label .required {
            color: #dc3545;
            margin-left: 0.25rem;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 1.1rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: #2c3e50;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1E4D8C;
            box-shadow: 0 0 0 3px rgba(30, 77, 140, 0.1);
        }

        .form-group input::placeholder,
        .form-group select::placeholder {
            color: #adb5bd;
        }

        .password-strength {
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .strength-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .strength-meter {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .strength-weak { background: #dc3545; width: 25%; }
        .strength-fair { background: #ffc107; width: 50%; }
        .strength-good { background: #28a745; width: 75%; }
        .strength-strong { background: #20c997; width: 100%; }

        .strength-text {
            font-size: 0.85rem;
            color: #6c757d;
        }

        .terms-section {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0;
            margin-top: 0.25rem;
        }

        .checkbox-group label {
            margin: 0;
            color: #2c3e50;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .checkbox-group a {
            color: #1E4D8C;
            text-decoration: none;
            font-weight: 600;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .register-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1E4D8C, #2A5F9F);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 77, 140, 0.4);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }

        .login-link p {
            color: #6c757d;
            margin-bottom: 0.5rem;
        }

        .login-link a {
            color: #1E4D8C;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #2A5F9F;
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #6c757d;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #1E4D8C;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #fcc;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #393;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #cfc;
            display: none;
            font-size: 0.9rem;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .register-btn.loading .loading-spinner {
            display: inline-block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .client-register-page {
                padding: 1rem;
            }

            .register-container {
                padding: 2rem;
                margin: 1rem;
            }

            .register-header h1 {
                font-size: 1.8rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="client-register-page">
    <div class="register-container">
        <div class="register-header">
            <div class="brand-logo">
                <i class="fas fa-wifi"></i>
                <span>Linknet<span class="brand-accent">Fiber</span></span>
            </div>
            <h1>Create Account</h1>
            <p>Join Linknet Fiber and enjoy high-speed internet</p>
        </div>

        <form class="register-form" onsubmit="handleRegistration(event)">
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>
            
            <!-- Personal Information -->
            <div class="form-section">
                <h3 style="color: #1E4D8C; margin-bottom: 1.5rem; font-size: 1.2rem;">Personal Information</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullname">Full Name <span class="required">*</span></label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fullname" name="fullname" required placeholder="John Doe">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" required placeholder="your@email.com">
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number <span class="required">*</span></label>
                        <div class="input-group">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="phone" name="phone" required placeholder="+254 7XX XXX XXX">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="idnumber">ID Number <span class="required">*</span></label>
                        <div class="input-group">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="idnumber" name="idnumber" required placeholder="12345678">
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="dateOfBirth">Date of Birth</label>
                        <div class="input-group">
                            <i class="fas fa-calendar"></i>
                            <input type="date" id="dateOfBirth" name="dateOfBirth">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <div class="input-group">
                            <i class="fas fa-venus-mars"></i>
                            <select id="gender" name="gender">
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Address Information -->
            <div class="form-section">
                <h3 style="color: #1E4D8C; margin-bottom: 1.5rem; margin-top: 2rem; font-size: 1.2rem;">Address Information</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="county">County <span class="required">*</span></label>
                        <div class="input-group">
                            <i class="fas fa-map-marker-alt"></i>
                            <select id="county" name="county" required>
                                <option value="">Select County</option>
                                <option value="nairobi">Nairobi</option>
                                <option value="mombasa">Mombasa</option>
                                <option value="kisumu">Kisumu</option>
                                <option value="nakuru">Nakuru</option>
                                <option value="eldoret">Eldoret</option>
                                <option value="kiambu">Kiambu</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="estate">Estate/Area <span class="required">*</span></label>
                        <div class="input-group">
                            <i class="fas fa-home"></i>
                            <input type="text" id="estate" name="estate" required placeholder="Kilimani">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="street">Street/Road <span class="required">*</span></label>
                    <div class="input-group">
                        <i class="fas fa-road"></i>
                        <input type="text" id="street" name="street" required placeholder="Ngong Road">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="building">Building/Apartment</label>
                        <div class="input-group">
                            <i class="fas fa-building"></i>
                            <input type="text" id="building" name="building" placeholder="Safari Towers">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="houseNumber">House/Unit Number</label>
                        <div class="input-group">
                            <i class="fas fa-door-open"></i>
                            <input type="text" id="houseNumber" name="houseNumber" placeholder="A-101">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="landmark">Landmark (Optional)</label>
                    <div class="input-group">
                        <i class="fas fa-map-pin"></i>
                        <input type="text" id="landmark" name="landmark" placeholder="Near Uchumi Supermarket">
                    </div>
                </div>
            </div>
            
            <!-- Account Information -->
            <div class="form-section">
                <h3 style="color: #1E4D8C; margin-bottom: 1.5rem; margin-top: 2rem; font-size: 1.2rem;">Account Information</h3>
                
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required placeholder="Create a strong password">
                    </div>
                    <div class="password-strength">
                        <div class="strength-label">Password Strength</div>
                        <div class="strength-meter">
                            <div class="strength-bar" id="strength-bar"></div>
                        </div>
                        <div class="strength-text" id="strength-text">Enter a password</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                    </div>
                </div>
            </div>
            
            <!-- Terms and Conditions -->
            <div class="terms-section">
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the <a href="#" onclick="showTerms()">Terms and Conditions</a> and <a href="#" onclick="showPrivacy()">Privacy Policy</a> <span class="required">*</span>
                    </label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="marketing" name="marketing">
                    <label for="marketing">
                        I would like to receive promotional emails and SMS notifications about Linknet Fiber services and offers
                    </label>
                </div>
            </div>
            
            <button type="submit" class="register-btn" id="register-btn">
                <span class="loading-spinner"></span>
                <span class="btn-text">Create Account</span>
            </button>
        </form>
        
        <div class="divider">
            <span>Already have an account?</span>
        </div>
        
        <div class="login-link">
            <p>Ready to access your account?</p>
            <a href="login.html">Sign In Now</a>
        </div>
        
        <div class="back-link">
            <a href="#" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back to Login Options
            </a>
        </div>
    </div>

    <script src="../js/darkmode.js"></script>
    <script src="../js/auth-manager.js?v=1.0.0"></script>
    <script src="../js/validation.js?v=1.0.0"></script>
    <script src="../js/offline-manager.js?v=1.0.0"></script>
    <script>
        function showMessage(message, isError = false) {
            const errorElement = document.getElementById('error-message');
            const successElement = document.getElementById('success-message');
            
            // Hide both messages first
            errorElement.classList.remove('show');
            successElement.classList.remove('show');
            
            if (isError) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
            } else {
                successElement.textContent = message;
                successElement.classList.add('show');
            }
            
            // Hide message after 5 seconds
            setTimeout(() => {
                errorElement.classList.remove('show');
                successElement.classList.remove('show');
            }, 5000);
        }

        function setLoading(loading) {
            const registerBtn = document.getElementById('register-btn');
            const btnText = registerBtn.querySelector('.btn-text');
            
            if (loading) {
                registerBtn.classList.add('loading');
                registerBtn.disabled = true;
                btnText.textContent = 'Creating Account...';
            } else {
                registerBtn.classList.remove('loading');
                registerBtn.disabled = false;
                btnText.textContent = 'Create Account';
            }
        }

        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');
            
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            strengthBar.className = 'strength-bar';
            
            if (password.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = 'Enter a password';
            } else if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = 'Weak password';
            } else if (strength === 3) {
                strengthBar.classList.add('strength-fair');
                strengthText.textContent = 'Fair password';
            } else if (strength === 4) {
                strengthBar.classList.add('strength-good');
                strengthText.textContent = 'Good password';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = 'Strong password';
            }
        }

        async function handleRegistration(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match. Please check and try again.', true);
                return;
            }
            
            // Validate password strength
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long.', true);
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch('/api/customers/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fullname: formData.get('fullname'),
                        email: formData.get('email'),
                        phone: formData.get('phone'),
                        idNumber: formData.get('idnumber'),
                        dateOfBirth: formData.get('dateOfBirth'),
                        gender: formData.get('gender'),
                        county: formData.get('county'),
                        estate: formData.get('estate'),
                        street: formData.get('street'),
                        building: formData.get('building'),
                        houseNumber: formData.get('houseNumber'),
                        landmark: formData.get('landmark'),
                        password: password,
                        marketing: formData.get('marketing') === 'on'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Account created successfully! Redirecting to login...', false);
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message || 'Registration failed. Please try again.', true);
                }
            } catch (error) {
                showMessage('Network error. Please check your connection and try again.', true);
            } finally {
                setLoading(false);
            }
        }

        function showTerms() {
            alert('Terms and Conditions will be displayed here. This would typically open a modal or navigate to a terms page.');
        }

        function showPrivacy() {
            alert('Privacy Policy will be displayed here. This would typically open a modal or navigate to a privacy page.');
        }

        function goBack() {
            window.location.href = '../login.html';
        }

        // Password strength checker
        document.getElementById('password').addEventListener('input', function(e) {
            checkPasswordStrength(e.target.value);
        });

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', function() {
            const clientToken = localStorage.getItem('clientToken');
            if (clientToken) {
                // Verify token is still valid
                fetch('/api/customers/verify-token', {
                    headers: {
                        'Authorization': `Bearer ${clientToken}`
                    }
                }).then(response => {
                    if (response.ok) {
                        window.location.href = 'dashboard.html';
                    } else {
                        // Token is invalid, remove it
                        localStorage.removeItem('clientToken');
                        localStorage.removeItem('clientData');
                    }
                }).catch(() => {
                    // Network error, remove token just in case
                    localStorage.removeItem('clientToken');
                    localStorage.removeItem('clientData');
                });
            }
        });
    </script>
</body>
</html>
