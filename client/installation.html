<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installation Status - Linknet Fiber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=1.7">
    <link rel="stylesheet" href="../css/client.css?v=1.7">
</head>
<body class="client-dashboard">
    <!-- Sidebar -->
    <aside class="client-sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="login-logo">
                <span class="brand-text">Linknet<span class="brand-accent">Fiber</span></span>
            </a>
            <p>Client Portal</p>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a href="dashboard.html">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="service.html">
                        <i class="fas fa-wifi"></i> My Service
                    </a>
                </li>
                <li>
                    <a href="billing.html">
                        <i class="fas fa-file-invoice-dollar"></i> Billing
                    </a>
                </li>
                <li class="active">
                    <a href="installation.html">
                        <i class="fas fa-tools"></i> Installation Status
                    </a>
                </li>
                <li>
                    <a href="support.html">
                        <i class="fas fa-headset"></i> Support
                    </a>
                </li>
                <li>
                    <a href="settings.html">
                        <i class="fas fa-cog"></i> Settings
                    </a>
                </li>
            </ul>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info" id="client-user-info">
                <div class="user-avatar">
                    <span id="user-avatar-initial">C</span>
                </div>
                <div class="user-details">
                    <div class="user-name" id="user-name">John Doe</div>
                    <div class="user-role" id="user-role">Client</div>
                </div>
            </div>
            <button class="btn btn-outline btn-block" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="client-main">
        <header class="client-header">
            <div class="header-left">
                <button class="sidebar-toggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Installation Status</h1>
            </div>
            <div class="header-right">
                <div class="header-actions">
                    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </header>
        
        <div class="client-content">
            <div id="installation-content">
                <!-- Content will be loaded dynamically based on installation status -->
                <div class="loading-spinner">Loading installation status...</div>
            </div>
        </div>

        <!-- Installation Request Modal -->
        <div id="installation-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-tools"></i> Request Installation</h2>
                    <button class="modal-close" id="close-modal-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="installation-request-form">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-input" id="install-fullname" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="install-email" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-input" id="install-phone" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">County</label>
                            <input type="text" class="form-input" id="install-county" placeholder="e.g., Nairobi" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Estate/Area</label>
                            <input type="text" class="form-input" id="install-estate" placeholder="e.g., Kilimani" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Physical Address</label>
                            <textarea class="form-input" id="install-address" rows="3" placeholder="Enter your full physical address" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Select Package</label>
                            <select class="form-select" id="install-package" required>
                                <option value="">Select a package</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Preferred Installation Date</label>
                            <input type="date" class="form-input" id="install-date" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-paper-plane"></i> Submit Request
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/client-auth.js"></script>
    <script src="../js/client-api.js"></script>
    <script src="../js/client-dashboard.js"></script>
    <script src="../js/client-installation.js"></script>
</body>
</html>
