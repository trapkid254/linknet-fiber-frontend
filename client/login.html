<!-- client/login.html - Client Login -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA / App Install -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Linknet Fiber">
    <meta name="theme-color" content="#1E4D8C">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">

    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Client Login - Linknet Fiber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=1.3">
    <link rel="stylesheet" href="../css/admin.css?v=1.3">
    <style>
        /* Client Login Styles */
        .client-login-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #1E4D8C 0%, #2A5F9F 50%, #3A7BC8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .client-login-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="20" cy="80" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="80" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            background-size: 100px 100px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 100px); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .brand-logo i {
            font-size: 2.5rem;
            color: #1E4D8C;
        }

        .brand-logo span {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1E4D8C;
        }

        .brand-logo .brand-accent {
            color: #4ecdc4;
        }

        .login-header h1 {
            color: #1E4D8C;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 0;
        }

        .login-form {
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 1.1rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: #2c3e50;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1E4D8C;
            box-shadow: 0 0 0 3px rgba(30, 77, 140, 0.1);
        }

        .form-group input::placeholder {
            color: #adb5bd;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .remember-me label {
            margin: 0;
            color: #6c757d;
            cursor: pointer;
        }

        .forgot-link {
            color: #1E4D8C;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: #2A5F9F;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1E4D8C, #2A5F9F);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 77, 140, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }

        .register-link p {
            color: #6c757d;
            margin-bottom: 0.5rem;
        }

        .register-link a {
            color: #1E4D8C;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #2A5F9F;
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #6c757d;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #1E4D8C;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #fcc;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #393;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #cfc;
            display: none;
            font-size: 0.9rem;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-btn.loading .loading-spinner {
            display: inline-block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .client-login-page {
                padding: 1rem;
            }

            .login-container {
                padding: 2rem;
                margin: 1rem;
            }

            .login-header h1 {
                font-size: 1.8rem;
            }

            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body class="client-login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="brand-logo">
                <i class="fas fa-wifi"></i>
                <span>Linknet<span class="brand-accent">Fiber</span></span>
            </div>
            <h1>Client Portal</h1>
            <p>Access your account and manage your services</p>
        </div>

        <form class="login-form" onsubmit="handleClientLogin(event)">
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
            </div>
            
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn" id="login-btn">
                <span class="loading-spinner"></span>
                <span class="btn-text">Sign In</span>
            </button>
        </form>
        
        <div class="divider">
            <span>New to Linknet Fiber?</span>
        </div>
        
        <div class="register-link">
            <p>Don't have an account yet?</p>
            <a href="#" onclick="goToRegistration()">Register Now</a>
        </div>
        
        <div class="back-link">
            <a href="#" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back to Login Options
            </a>
        </div>
    </div>

    <script src="../js/darkmode.js"></script>
    <script src="../js/auth-manager.js?v=1.0.0"></script>
    <script src="../js/validation.js?v=1.0.0"></script>
    <script src="../js/offline-manager.js?v=1.0.0"></script>
    <script src="../js/client-auth.js?v=1.0.0"></script>
    <script>
        function showMessage(message, isError = false) {
            const errorElement = document.getElementById('error-message');
            const successElement = document.getElementById('success-message');
            
            // Hide both messages first
            errorElement.classList.remove('show');
            successElement.classList.remove('show');
            
            if (isError) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
            } else {
                successElement.textContent = message;
                successElement.classList.add('show');
            }
            
            // Hide message after 5 seconds
            setTimeout(() => {
                errorElement.classList.remove('show');
                successElement.classList.remove('show');
            }, 5000);
        }

        function setLoading(loading) {
            const loginBtn = document.getElementById('login-btn');
            const btnText = loginBtn.querySelector('.btn-text');
            
            if (loading) {
                loginBtn.classList.add('loading');
                loginBtn.disabled = true;
                btnText.textContent = 'Signing In...';
            } else {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
                btnText.textContent = 'Sign In';
            }
        }

        async function handleClientLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            setLoading(true);
            
            try {
                const result = await clientAuth.login(email, password);
                
                if (result.success) {
                    showMessage('Login successful! Redirecting...', false);
                    
                    if (remember) {
                        localStorage.setItem('rememberClient', 'true');
                    }
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showMessage(result.error || 'Login failed. Please check your credentials.', true);
                }
            } catch (error) {
                showMessage('Network error. Please check your connection and try again.', true);
            } finally {
                setLoading(false);
            }
        }

        function goToRegistration() {
            window.location.href = 'register.html';
        }

        function goBack() {
            window.location.href = '../login.html';
        }

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', function() {
            const clientToken = localStorage.getItem('clientToken');
            if (clientToken) {
                // Verify token is still valid
                fetch('/api/customers/verify-token', {
                    headers: {
                        'Authorization': `Bearer ${clientToken}`
                    }
                }).then(response => {
                    if (response.ok) {
                        window.location.href = 'dashboard.html';
                    } else {
                        // Token is invalid, remove it
                        localStorage.removeItem('clientToken');
                        localStorage.removeItem('clientData');
                    }
                }).catch(() => {
                    // Network error, remove token just in case
                    localStorage.removeItem('clientToken');
                    localStorage.removeItem('clientData');
                });
            }
        });

        // Auto-fill remembered email if exists
        const rememberedEmail = localStorage.getItem('rememberedEmail');
        if (rememberedEmail) {
            document.getElementById('email').value = rememberedEmail;
            document.getElementById('remember').checked = true;
        }

        // Save email if remember me is checked
        document.getElementById('remember').addEventListener('change', function() {
            const email = document.getElementById('email').value;
            if (this.checked && email) {
                localStorage.setItem('rememberedEmail', email);
            } else {
                localStorage.removeItem('rememberedEmail');
            }
        });
    </script>
</body>
</html>
